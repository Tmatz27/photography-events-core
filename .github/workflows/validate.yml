name: Core milestone validation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.lock
      - uses: actions/checkout@v4
        with:
          repository: Tmatz27/Home-assistant-photography-events
          ref: 4905e35c0668c37737d84685e65d2a806f7c92f7
          path: evidence/legacy
      - name: Independent legacy recapture and differential comparisons
        env:
          PYTHONPATH: src
        run: |
          python tools/capture_legacy_parity.py --legacy-repo evidence/legacy --output /tmp/legacy-recaptured.json
          cmp tests/fixtures/legacy_tule_elk.json /tmp/legacy-recaptured.json
          python tools/verify_legacy_pipeline.py --legacy-repo evidence/legacy --output /tmp/legacy-pipeline.json --report evidence/parity.json --count 18000
          cmp tests/fixtures/legacy_pipeline.json /tmp/legacy-pipeline.json
      - name: Static checks and portable tests
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src migrations tools
          python -m ruff check src migrations tools tests
          python -m pytest -q
          CORE_API_TOKEN=$(python -c 'import secrets; print(secrets.token_hex(32))') CORE_DATABASE_URL=postgresql+asyncpg://unused:unused@localhost/unused python -c 'import json; from pec.api import create_app; print(json.dumps(create_app().openapi()))' > /tmp/openapi.json
      - name: Docker, PostGIS, migrations, failure injection and restore
        env:
          PYTHONPATH: src
        run: python tools/acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-milestone-evidence
          path: |
            evidence/acceptance.json
            evidence/pytest.log
            evidence/tests.xml
            evidence/parity.json
            evidence/frozen-database.json
            evidence/m2-performance.json
          if-no-files-found: warn
